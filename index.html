<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUISENVIVO | Próximamente</title>

    <!-- Favicon Personalizado -->
    <link rel="icon" type="image/jpeg" href="https://img.hearthis.at/7/9/6/_/uploads/9722627/image_user/w800_q70_ptrue_v2_----1775233572697.jpg">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bunker: {
                            bg: '#070709',
                            panel: 'rgba(16, 17, 22, 0.88)',
                            card: 'rgba(22, 24, 33, 0.6)',
                            accent: '#ff7700',
                            cyan: '#06b6d4'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #070709;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .bg-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .glass-panel {
            background: rgba(16, 17, 22, 0.88);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(22, 24, 33, 0.6);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 119, 0, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-bunker-bg bg-grid min-h-screen flex flex-col justify-between items-center p-6 selection:bg-orange-500 selection:text-black">

    <!-- Header mínimo -->
    <header class="w-full max-w-4xl mx-auto flex items-center justify-between py-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl overflow-hidden border border-white/20">
                <img src="https://img.hearthis.at/7/9/6/_/uploads/9722627/image_user/w800_q70_ptrue_v2_----1775233572697.jpg" alt="LUISENVIVO" class="w-full h-full object-cover">
            </div>
            <span class="font-black tracking-wider text-white text-lg">LUISENVIVO</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-orange-950/60 border border-orange-500/30 text-orange-400 text-xs font-mono">
            <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
            <span>SITIO EN CONSTRUCCIÓN</span>
        </div>
    </header>

    <!-- Contenido Central -->
    <main class="w-full max-w-2xl mx-auto text-center space-y-8 my-auto py-12">
        <div class="glass-panel rounded-3xl p-8 sm:p-12 border border-white/10 shadow-2xl space-y-6 relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="w-20 h-20 mx-auto rounded-2xl bg-orange-500/10 border border-orange-500/30 flex items-center justify-center text-orange-400 text-3xl shadow-lg">
                <i class="fa-solid fa-person-digging"></i>
            </div>

            <div class="space-y-3">
                <h1 class="text-3xl sm:text-4xl font-black text-white tracking-tight">Estamos preparando algo nuevo</h1>
                <p class="text-sm sm:text-base text-gray-400 leading-relaxed">
                    El espacio oficial de <strong class="text-white">LUISENVIVO</strong> se está actualizando para ofrecerte la mejor experiencia en Progressive House y Melodic Techno.
                </p>
            </div>

            <!-- Accesos directos esenciales mientras tanto -->
            <div class="pt-4 border-t border-white/10 space-y-3">
                <p class="text-xs font-mono text-gray-500 uppercase tracking-widest">Canales oficiales de transmisión</p>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <a href="https://twitch.tv/luisenvivo" target="_blank" class="glass-card p-3 rounded-xl border border-purple-500/30 flex items-center justify-center gap-2 text-purple-300 hover:text-white text-xs font-semibold">
                        <i class="fa-brands fa-twitch"></i> Twitch
                    </a>
                    <a href="https://hearthis.at/luisenvivo/" target="_blank" class="glass-card p-3 rounded-xl border border-orange-500/30 flex items-center justify-center gap-2 text-orange-300 hover:text-white text-xs font-semibold">
                        <i class="fa-solid fa-cloud"></i> Hearthis.at
                    </a>
                    <a href="https://kick.com/luisenvivo" target="_blank" class="glass-card p-3 rounded-xl border border-emerald-500/30 flex items-center justify-center gap-2 text-emerald-300 hover:text-white text-xs font-semibold">
                        <i class="fa-solid fa-bolt"></i> Kick
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-4xl mx-auto py-6 text-center text-xs text-gray-500 font-mono">
        <p>© 2026 LUISENVIVO | Argentina</p>
    </footer>

</body>
</html>
